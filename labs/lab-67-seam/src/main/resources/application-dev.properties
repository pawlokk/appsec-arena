server.port=5000
spring.datasource.url=jdbc:postgresql://localhost:5432/seamdb
spring.datasource.username=seamuser
spring.datasource.password=seampass

management.endpoints.web.exposure.include=*
management.endpoint.env.enabled=true
management.endpoint.health.show-details=always

app.debug.sql.enabled=true
app.dev.security.permissive=true
app.scheduler.enabled=false

logging.level.com.arena.seam=DEBUG
logging.level.org.springframework.security=DEBUG

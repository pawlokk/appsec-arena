server.port=5000
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seamdb}
spring.datasource.username=${DB_USER:seamuser}
spring.datasource.password=${DB_PASS:seampass}

app.analytics.datasource.jdbc-url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seamdb}
app.analytics.datasource.username=${DB_USER:seamuser}
app.analytics.datasource.password=${DB_PASS:seampass}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.scheduler.enabled=true
app.scheduler.interval=30000

logging.level.com.arena.seam=INFO

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shale API Gateway</title>
<style>
  body { background: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; padding: 40px; }
  h1 { color: #58a6ff; }
  p { color: #8b949e; max-width: 600px; line-height: 1.6; }
  code { background: #161b22; padding: 2px 6px; border-radius: 4px; color: #79c0ff; }
  .endpoints { margin-top: 24px; }
  .endpoint { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; }
  .method { color: #3fb950; font-weight: bold; margin-right: 8px; }
  .path { color: #e3b341; }
</style>
</head>
<body>
<h1>Shale API Gateway</h1>
<p>API gateway with multiple backend microservices. Explore the service endpoints.</p>
<div class="endpoints">
  <div class="endpoint"><span class="method">GET</span><span class="path">/files</span></div>
  <div class="endpoint"><span class="method">POST</span><span class="path">/files/import</span></div>
  <div class="endpoint"><span class="method">GET</span><span class="path">/users</span></div>
  <div class="endpoint"><span class="method">GET</span><span class="path">/render</span></div>
</div>
</body>
</html>

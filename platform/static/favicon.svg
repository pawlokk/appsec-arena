<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0d0f14"/>
  <!-- outer ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#5c8aff" stroke-width="5"/>
  <!-- inner ring -->
  <circle cx="50" cy="50" r="13" fill="none" stroke="#5c8aff" stroke-width="4"/>
  <!-- center dot -->
  <circle cx="50" cy="50" r="4" fill="#c0d0ff"/>
  <!-- crosshair arms — symmetric, gap matches inner ring radius -->
  <line x1="50" y1="8"  x2="50" y2="33" stroke="#5c8aff" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="67" x2="50" y2="92" stroke="#5c8aff" stroke-width="5" stroke-linecap="round"/>
  <line x1="8"  y1="50" x2="33" y2="50" stroke="#5c8aff" stroke-width="5" stroke-linecap="round"/>
  <line x1="67" y1="50" x2="92" y2="50" stroke="#5c8aff" stroke-width="5" stroke-linecap="round"/>
</svg>

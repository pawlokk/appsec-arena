# AppSec Arena — Lab sidecar nginx
# Injects a 48px top bar into every lab response.
# The lab app runs on 127.0.0.1:5000 inside the container.

worker_processes 1;
events { worker_connections 64; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Arena header assets (served from /arena-static/)
  server {
    listen 80;

    # Serve the injected bar assets
    location /arena-static/ {
      alias /arena-static/;
    }

    # Inject the bar via sub_filter on HTML responses
    location / {
      proxy_pass         http://127.0.0.1:5000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_buffering    on;

      # Only rewrite HTML
      sub_filter_types text/html;
      sub_filter_once  on;

      # Insert bar + stylesheet link right after <body>
      sub_filter '<body>' '<body><div id="arena-bar"></div><link rel="stylesheet" href="/arena-static/bar.css"><script src="/arena-static/bar.js" defer></script>';
    }
  }
}
